apiVersion: v1
kind: ConfigMap
metadata: 
  name: catalogue
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
   # labels related to deployment resource
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
 replicas: 1
 selector:
    matchLabels:
        project: roboshop
        tier: backend
        component: catalogue
##its a pod defination
 template:
  metadata:
    labels:
       project: roboshop
       tier: backend
       component: catalogue
  spec:
   containers:
     - name: catalogue
       image: srikanth865/catalogue:v1
       envFrom:
        - configMapRef:
           name: catalogue
      
---
apiVersion: v1
kind: Service
metadata:
 name: catalogue
 namespace: roboshop
 # servicer labels
 labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
 selector:
    project: roboshop
    tier: backend
    component: catalogue
 ports:
  - protocol: TCP
    port: 8080 #serviceport
    targetPort: 8080  #container port
